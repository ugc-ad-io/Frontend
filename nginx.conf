# Static host for the React SPA.
#
# Port 8080, not 80: binding below 1024 requires root, and this lets the
# container run unprivileged. Map it to whatever you like on the host.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version on errors/headers.
    server_tokens off;

    # ── SPA history fallback ────────────────────────────────────────────────
    # This is the container equivalent of the rewrite in vercel.json. React
    # Router owns the URL space, so any path that isn't a real file has to be
    # answered with index.html — otherwise deep links and refreshes on
    # /dashboard/creator, /auth, etc. return a hard 404 from nginx and the app
    # never boots. Try the literal file, then a directory, then hand it to React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caching ─────────────────────────────────────────────────────────────
    # CRA fingerprints every asset it emits (main.<hash>.js). A new deploy
    # produces new filenames, so these can be cached hard and forever — the
    # browser only requests a URL it has never seen.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media and fonts are NOT fingerprinted (they're copied from public/ under
    # their original names), so a shorter TTL keeps a replaced file from being
    # stuck in caches for a year.
    location ~* \.(?:mp4|webm|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|glb)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html must NEVER be cached. It is the document that points at the
    # fingerprinted bundles; if a stale copy is served, the browser asks for the
    # PREVIOUS deploy's asset names, which no longer exist, and the app breaks
    # after a deploy until a hard refresh.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff font/woff2;
    # Already-compressed formats (video, png/jpg/webp) are deliberately absent —
    # re-compressing them burns CPU for no size gain.

    # ── Baseline security headers ───────────────────────────────────────────
    # Deliberately no Content-Security-Policy here: the app loads Google Fonts,
    # Google Sign-In and Cloudinary media, so a CSP has to be written against
    # that real list or it will silently break them. Worth adding once the
    # external origins are pinned down.
    add_header X-Content-Type-Options  "nosniff"            always;
    add_header X-Frame-Options         "SAMEORIGIN"         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Health endpoint for load balancers / compose healthchecks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
